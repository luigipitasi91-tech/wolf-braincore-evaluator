name: V8V CI

on:
  push:
    branches: [v8v-runtime]
  pull_request:
    paths:
      - 'v8v/**'
      - '.github/workflows/v8v.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v8v
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npx playwright install chromium
      - name: Browser smoke test
        run: |
          node -e "import('./runtime.mjs').then(async m=>{const s=await m.createSession({startUrl:'https://example.com',allowedDomains:['example.com']});const snap=await m.snapshotSession(s.id,{textLimit:300});if(snap.title!=='Example Domain')throw new Error('bad title');await m.closeSession(s.id);process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
