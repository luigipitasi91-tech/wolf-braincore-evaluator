name: V8V CI

on:
  push:
    branches: [v8v-runtime, v8v-production]
  pull_request:
    paths:
      - 'v8v/**'
      - '.github/workflows/v8v.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v8v
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium
      - run: npm test
      - name: Browser smoke test
        run: |
          node -e "import('./runtime.mjs').then(async m=>{const s=await m.createSession({startUrl:'https://example.com',allowedDomains:['example.com']});const snap=await m.snapshotSession(s.id,{textLimit:300});if(snap.title!=='Example Domain')throw new Error('bad title');await m.closeSession(s.id);process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Na0mi remote-browser compatibility smoke
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:compat 2>&1 | tee compat-output.txt
      - name: V8V autonomous agent smoke
        run: node smoke/agent-live.mjs
      - name: Upload compatibility failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v8v-compat-output
          path: v8v/compat-output.txt


  production-smoke:
    if: github.ref == 'refs/heads/v8v-production'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render production health
        shell: bash
        run: |
          set -euo pipefail
          url="https://v8v-production.onrender.com/health"
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 20 "$url" || true)
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"version":"0.3.0"'; then
              echo "$body"
              exit 0
            fi
            echo "waiting for production deploy ($i/24)"
            sleep 10
          done
          echo "production health never became ready"
          exit 1

      - name: Verify live autonomous agent self-test
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 60 "https://v8v-production.onrender.com/selftest/agent")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"version":"0.3.0"'
          echo "$body" | grep -q '"finality":"PROVISIONAL_SUCCESS"'
