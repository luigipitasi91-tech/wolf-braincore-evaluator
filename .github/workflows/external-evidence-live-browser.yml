name: WOLF External Evidence Real Browser

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "external.html"
      - "src/external-audit.mjs"
      - "src/external-audit-app.js"
      - "tests/external-audit-live-browser.mjs"
      - ".github/workflows/external-evidence-live-browser.yml"
  push:
    branches: [main]
    paths:
      - "external.html"
      - "src/external-audit.mjs"
      - "src/external-audit-app.js"
      - "tests/external-audit-live-browser.mjs"
      - ".github/workflows/external-evidence-live-browser.yml"

permissions:
  contents: read

jobs:
  live-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install isolated Playwright runner
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium for runner
        run: npx playwright install --with-deps chromium
      - name: Verify live external audit and original judge demo
        env:
          WOLF_JUDGE_URL: https://wolf-braincore-evaluator.onrender.com
        run: node tests/external-audit-live-browser.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-external-audit-live-browser
          path: artifacts/external-evidence-browser/
          retention-days: 14
          if-no-files-found: warn
